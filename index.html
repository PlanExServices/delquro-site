<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delquro Labs</title>
  <meta name="description" content="Delquro Labs — Application Design & Development" />
  <style>
    :root{
      --teal:#48AEB3;
      --dark:#191C24;
      --light:#F7FAFB;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--dark);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:32px;
    }
    .card{
      width:100%;
      max-width:720px;
      background:white;
      border-radius:20px;
      padding:48px 36px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      text-align:center;
    }
    .logo{
      width:140px;
      height:auto;
      margin:0 auto 24px;
      display:block;
    }
    h1{
      margin:0 0 8px;
      font-size:42px;
      line-height:1.1;
      color:var(--dark);
    }
    h2{
      margin:0 0 24px;
      font-size:20px;
      font-weight:600;
      color:var(--teal);
    }
    p{
      margin:0 auto 28px;
      max-width:560px;
      font-size:18px;
      line-height:1.6;
    }
    a.button{
      display:inline-block;
      background:var(--teal);
      color:white;
      text-decoration:none;
      padding:14px 22px;
      border-radius:12px;
      font-weight:700;
      margin-bottom:24px;
    }
    .contact{
      font-size:16px;
    }
    .contact a{
      color:var(--dark);
      text-decoration:none;
      font-weight:700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Delquro Labs</h1>
    <h2>Application Design &amp; Development</h2>
    <p>We build software and digital tools.</p>

    info@delquro.comContact Us</a>

    <div class="contact">
      info@delquro.cominfo@delquro.com</a>
    </div>
  </main>
</body>
</html>
